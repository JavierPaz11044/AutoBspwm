# Neofetch for Zeneapp theme; images live under ~/.config/autobspwm/assets/neofetch/
print_info() {
    info title
    info underline
    info distro
    info kernel
    info uptime
    info packages
    info shell
    info de
    info wm
    info term
    info cpu
    info memory
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_cores="logical"
colors=(distro)
bold="on"
separator="  "
image_backend="kitty"
image_source="${HOME}/.config/autobspwm/assets/neofetch/hello_kitty/kitty.png"
crop_mode="normal"
crop_offset="center"
image_size="260px"
gap=3
yoffset=0
xoffset=0
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
ascii_distro="auto"
ascii_colors=(distro)
stdout="off"
