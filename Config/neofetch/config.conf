# Neofetch config for Kitty startup (Debian-friendly; ASCII, no extra image deps)
print_info() {
    info title
    info underline
    info distro
    info kernel
    info uptime
    info packages
    info shell
    info de
    info wm
    info term
    info cpu
    info gpu
    info memory
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
cpu_brand="on"
cpu_cores="logical"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
colors=(distro)
bold="on"
separator="  "
image_backend="off"
ascii_distro="auto"
ascii_colors=(distro)
stdout="off"
